<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fieldwork · Applied AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f1;color:#1b2a26;font:16px/1.55 "DM Sans",system-ui,sans-serif}header{background:#183e35;color:#fff;padding:15px max(5vw,18px);display:flex;align-items:center;justify-content:space-between;gap:20px}header b{font:600 1.65rem Georgia,serif}header span{color:#cce6da;font-size:.88rem}a{color:#245c4d;text-underline-offset:3px}header a{color:white}main{max-width:1150px;margin:32px auto;padding:0 20px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:38px}aside h2,.label{font-size:.83rem;text-transform:uppercase;letter-spacing:.08em;color:#4e655c}nav{display:grid;gap:5px}button,textarea{font:inherit}button{cursor:pointer}nav button{background:transparent;text-align:left;border:0;border-radius:7px;padding:11px 12px;color:inherit;display:flex;align-items:center;gap:10px}nav button[aria-current=true]{background:#dbe7df;font-weight:650}.dot{width:11px;height:11px;background:var(--tone);border-radius:3px;flex:none}.hero{background:var(--hero,#173e33);color:#fff;padding:28px 32px;border-radius:15px}.hero small{color:#fff;opacity:.85}h1{font:normal clamp(2.1rem,5vw,3.5rem)/1.06 Georgia,serif;margin:12px 0}.hero p{margin:8px 0 0;max-width:55ch}article,.empty{background:#fff;padding:22px 26px;border:1px solid #d5dfd7;border-radius:12px;margin-top:15px}article h2{font:normal 1.6rem/1.2 Georgia,serif;margin:8px 0}article p{margin:8px 0}small{font-size:.84rem;color:#4e625a}.btn{background:white;color:#214c3d;border:1px solid #a7b8ad;border-radius:7px;padding:8px 14px;margin:8px 5px 2px 0}.primary{background:#214c3d;color:white}.content{overflow-wrap:anywhere}.content p{white-space:pre-wrap;margin:12px 0}.content h3{font-weight:650;font-size:1.1rem;margin:20px 0 6px}.content pre{white-space:pre-wrap;background:#eff4f1;padding:12px}textarea{width:100%;min-height:105px;display:block;margin:6px 0;padding:12px;border:1px solid #a9beb0;border-radius:8px}a,button,textarea{outline-offset:3px}.notice{color:#633e1b}.entryhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.entryhead small:first-child{border-left:4px solid var(--tone);padding-left:8px}footer{margin:24px 0} .noteform{border-top:1px solid #d5dfd7;margin-top:18px;padding-top:16px}
@media(max-width:720px){main{display:block;margin:16px auto;padding:0 12px}nav{display:flex;overflow-x:auto;padding-bottom:8px}nav button{white-space:nowrap}aside h2{margin:0 0 6px}.hero{margin-top:8px;padding:20px}article{padding:18px}header span{display:none}}
</style><header><div><b>Fieldwork</b> <span>/ Applied AI</span></div><a href="https://github.com/0x1Elliot/applied-ai-engineering-os/tree/feature/fieldwork-research-feed/projects/fieldwork" target="_blank" rel="noopener">Open GitHub</a></header><main><aside><h2>Research windows</h2><nav aria-label="Select a window"></nav></aside><section><div class="hero"><small id="cadence"></small><h1></h1><p id="intro"></p></div><div id="feed" aria-live="polite"></div><footer></footer></section></main>
<script>
const rooms={
 all:['Research feed','All schedules · New York time','Your lessons, research and engineering practice in one timeline.','#173e33','Open post','Field notes'],
 course:['Engineering course','Daily · 8 AM','Build the concept, verify the behavior, then explain it to a client.','#344769','Study lesson','Teach it back'],
 socratic:['Morning Socratic','Daily · 9 AM','State your position. What evidence would make you change your mind?','#643d5c','Take the question','My argument and counterexample'],
 skills:['SKILLs','Weekdays · 10 AM','One hour in the lab. Bring a failing case, a working fix and proof.','#78451e','Enter practice','My attempt, test result and demo link'],
 news:['AI news briefing','Daily · 8 AM','Five developments. Follow the primary sources and decide what deserves an experiment.','#26596a','Read briefing','Source worth following and why'],
 agents:['Multi-agent brief','Fridays · 9 AM','Inspect the handoff, the failure mode and the evidence behind the claim.','#4b4782','Review evidence','Hypothesis and reproduction notes'],
 desk:['Maintenance desk','Daily sweep · 8 AM','Review proposed fixes and their evidence. Approve individual changes through GitHub.','#4a5146','Inspect report','Review notes']
};
const $=s=>document.querySelector(s), el=(tag,txt)=>{const x=document.createElement(tag);if(txt!=null)x.textContent=txt;return x};
const action=(label,fn)=>{const b=el('button',label);b.type='button';b.className='btn';b.onclick=fn;return b};
let generation=0;
async function api(route,payload){const r=await fetch(route,payload?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}:{});if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json()}
function inline(node,line){const re=/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|https?:\/\/[^\s<>]+|\*\*([^*]+)\*\*/g;let end=0;for(const m of line.matchAll(re)){node.append(line.slice(end,m.index));if(m[3])node.append(el('strong',m[3]));else{const link=el('a',m[1]||m[0]);link.href=m[2]||m[0];link.target='_blank';link.rel='noopener noreferrer';node.append(link)}end=m.index+m[0].length}node.append(line.slice(end))}
function renderText(body){const block=el('div');block.className='content';let code=null;for(const line of body.split('\n')){if(line.startsWith('```')){if(!code){code=el('pre');block.append(code)}else code=null;continue}if(code){code.append(line+'\n');continue}if(!line.trim())continue;const sub=/^#{1,6}\s+/.test(line),p=el(sub?'h3':'p');inline(p,line.replace(/^#{1,6}\s+/,''));block.append(p)}return block}
function card(post){const room=rooms[post.room],a=el('article'),row=el('div');a.style.setProperty('--tone',room[3]);row.className='entryhead';row.append(el('small',room[0]),el('small',post.date+(post.excerpt?' · Archived excerpt':'')));a.append(row,el('h2',post.title));const summary=post.body.split('\n').find(l=>l.trim().length>45&&!l.startsWith('#'))||'';const snip=el('p',summary.replace(/\*\*/g,'').slice(0,200)+(summary.length>200?'…':''));a.append(snip);
 const detail=el('div');detail.hidden=true;const toggle=action(room[4],async()=>{detail.hidden=!detail.hidden;snip.hidden=!detail.hidden;toggle.textContent=detail.hidden?room[4]:'Close post';toggle.setAttribute('aria-expanded',String(!detail.hidden));if(detail.hidden||detail.childNodes.length)return;detail.append(renderText(post.body));const form=el('div');form.className='noteform';detail.append(form);
 const load=async()=>{form.replaceChildren();try{const path='/api/notebook?id='+encodeURIComponent(post.id),state=await api(path);const label=el('label',room[5]),note=el('textarea'),saved=el('input');note.maxLength=30000;note.value=state.note;label.append(note);saved.type='checkbox';saved.checked=state.saved;const mark=el('label');mark.append(saved,' Bookmark this post');const msg=el('small');msg.setAttribute('role','status');const save=action('Save to notebook',async()=>{save.disabled=true;try{await api(path,{note:note.value,saved:saved.checked});msg.textContent='Saved'}catch{msg.textContent='Could not save. Your draft is still here.'}finally{save.disabled=false}});form.append(label,mark,el('br'),save,msg)}catch{form.append(el('p','Notebook unavailable.'),action('Retry notebook',load))}};await load()});toggle.setAttribute('aria-expanded','false');a.append(toggle,detail);return a}
async function show(){const key=location.hash.slice(1),id=Object.hasOwn(rooms,key)?key:'all',room=rooms[id],version=++generation;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.room===id)));$('.hero').style.setProperty('--hero',room[3]);$('h1').textContent=room[0];$('#cadence').textContent=room[1];$('#intro').textContent=room[2];const feed=$('#feed'),foot=$('footer');feed.replaceChildren();foot.textContent='Loading posts…';
 async function more(cursor=''){try{const data=await api('/api/feed?room='+(id==='all'?'':id)+'&before='+encodeURIComponent(cursor));if(version!==generation)return;foot.replaceChildren();for(const item of data.posts)feed.append(card(item));if(!feed.children.length){const empty=el('div','The first published post will appear here.');empty.className='empty';feed.append(empty)}if(data.next)foot.append(action('Older posts',e=>{e.target.disabled=true;more(data.next)}))}catch{if(version!==generation)return;foot.replaceChildren(el('span','Could not load posts. '),action('Retry',()=>more(cursor)))}}await more()}
for(const [key,r] of Object.entries(rooms)){const b=action('',()=>{location.hash=key});b.className='';const mark=el('i');mark.className='dot';mark.style.setProperty('--tone',r[3]);b.append(mark,r[0]);b.dataset.room=key;$('nav').append(b)}window.addEventListener('hashchange',show);show();
</script></html>
