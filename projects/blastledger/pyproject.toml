[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blastledger"
version = "0.1.0"
description = "Deterministic read-only infrastructure change-risk engine"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21,<5", "fastapi>=0.110,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "uvicorn>=0.29,<1"]

[tool.setuptools.packages.find]
include = ["blastledger*"]

[tool.setuptools.package-data]
blastledger = ["schemas/*.json"]
