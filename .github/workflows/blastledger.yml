name: BlastLedger advisory review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# pull_request does not grant secrets to forks. Comments may be unavailable on fork PRs.
permissions:
  contents: read
  pull-requests: write

jobs:
  prechange-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base branch implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install review dependencies
        working-directory: projects/blastledger
        run: python -m pip install .
      - name: Run deterministic assessment and optionally comment
        id: assess
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLASTLEDGER_MANIFEST_PATH: projects/blastledger/examples/blastledger.json
          BLASTLEDGER_BLOCK_ON_HIGH_RISK: ${{ vars.BLASTLEDGER_BLOCK_ON_HIGH_RISK }}
        run: python -m blastledger.action
      - name: Show assessment verdict
        if: always()
        run: echo "BlastLedger review completed. Check the prior logs and PR comment; UNKNOWN is not PASS."
