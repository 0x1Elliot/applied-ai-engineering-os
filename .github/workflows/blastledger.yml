name: BlastLedger advisory review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# pull_request does not grant secrets to forks. Comments may be unavailable on fork PRs.
permissions:
  contents: read
  pull-requests: write

jobs:
  prechange-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base branch implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Bootstrap PR: base branch does not contain this package yet. Do not
      # check out untrusted PR code with a write-capable token to make it pass.
      - name: Bootstrap guard (trusted base package not installed yet)
        if: ${{ hashFiles('projects/blastledger/pyproject.toml') == '' }}
        run: echo 'Advisory Action starts after merge; separate BlastLedger tests verify this bootstrap PR.'
      - name: Install review dependencies
        if: ${{ hashFiles('projects/blastledger/pyproject.toml') != '' }}
        working-directory: projects/blastledger
        run: python -m pip install .
      - name: Run deterministic assessment and optionally comment
        if: ${{ hashFiles('projects/blastledger/pyproject.toml') != '' }}
        id: assess
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BLASTLEDGER_MANIFEST_PATH: projects/blastledger/examples/blastledger.json
          BLASTLEDGER_BLOCK_ON_HIGH_RISK: ${{ vars.BLASTLEDGER_BLOCK_ON_HIGH_RISK }}
        run: python -m blastledger.action
      - name: Show assessment verdict
        if: always()
        run: echo "BlastLedger advisory completed or safely deferred until base branch includes the engine. UNKNOWN is not PASS."
